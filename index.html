<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto Universitario - Corazones Interactivos</title>
  
  <!-- Importar fuente elegante desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Contenedor para centrar el título y aplicar perspectiva -->
  <div class="title-container">
    <h1 class="name-title" id="interactiveName">Te amo mi ratonsita loca</h1>
  </div>

  <!-- Contenedor para los corazones que flotarán -->
  <div id="heartContainer"></div>

  <script>
    // Función para crear un corazón en una posición específica
    function createHeart(x, y) {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '♥';
      
      // Posición donde aparecerá el corazón
      heart.style.left = `${x}px`;
      heart.style.top = `${y}px`;

      document.body.appendChild(heart);

      // Eliminar el corazón del DOM después de que termine la animación (2 segundos)
      setTimeout(() => {
        heart.remove();
      }, 2000);
    }

    // Generar un corazón en una posición completamente aleatoria de la pantalla
    function createRandomHeart() {
      const randomX = Math.random() * window.innerWidth;
      const randomY = Math.random() * window.innerHeight;
      createHeart(randomX, randomY);
    }

    // --- GENERACIÓN AUTOMÁTICA ---
    // Crea un corazón automáticamente cada 300 milisegundos
    setInterval(createRandomHeart, 300);

    // Evento al hacer clic para crear un corazón
    window.addEventListener('click', (e) => {
      createHeart(e.clientX, e.clientY);
    });
  </script>
</body>
</html>
